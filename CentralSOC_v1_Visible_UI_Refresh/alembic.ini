[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# URL is supplied by regexsoc.config.database_url() in migrations/env.py.
sqlalchemy.url = sqlite:///instance/regexsoc.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
